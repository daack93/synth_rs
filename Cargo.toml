[package]
name = "ftm_synth"
version = "0.1.0"
edition = "2021"
description = "Function Transformation Method physical-modeling string synth with an on-screen + MIDI keyboard"

[dependencies]
eframe = "0.29"
egui = "0.29"
cpal = "0.15"
midir = "0.10"

[profile.release]
opt-level = 3
lto = true

# A debug build of a real-time audio synth can underrun; default `cargo run`
# uses this profile, so give it enough optimization to keep the audio thread happy.
[profile.dev]
opt-level = 2
